# Relative asset paths (Vite base './') and a relative API path ('api/...') let the lab mount this stack under any
# prefix (/p/fast-and-slow/) with the prefix stripped before it reaches us.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;  # a published report; the API enforces the same limit
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";  # file names carry content hashes
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
